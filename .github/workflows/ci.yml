name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The Docker image's Python (Dockerfile)
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The web app's packages too: without them the web API and security tests are skipped
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir customtkinter pillow -r requirements-web.txt

      - name: Run unit tests (headless)
        # Use xvfb-run to provide a virtual frame buffer for tkinter/CTk
        run: |
          xvfb-run -s "-screen 0 1280x1024x24" python -m unittest discover -s tests -p "test_*.py"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install packages
        run: npm ci

      # Lint rules in web/biome.json; problems show up as annotations on the changed lines
      - name: Lint (Biome)
        run: npx biome ci --reporter=github

      - name: Unit tests (Vitest)
        run: npm test

      # Type-checks and builds the front end, as the Docker build does
      - name: Build the front end
        run: npm run build

      - name: Check for known vulnerabilities in the shipped packages
        run: npm audit --omit=dev --audit-level=high
