# This workflow will run Pylint on your Python code
# See: https://docs.github.com/en/actions

name: Lint Python with Pylint

on:
  push:
    branches: [ main, create-app ]
  pull_request:
    branches: [ main, create-app ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The app's packages too, or pylint reports their imports as import-error
          pip install pylint customtkinter pillow -r requirements-web.txt

      - name: Run Pylint on src and tests
        run: |
          pylint src tests
