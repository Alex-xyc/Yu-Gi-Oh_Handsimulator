# Deploys the web app to Google Cloud Run once CI has passed on main.
# Needs the repository variables GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER and
# GCP_DEPLOY_SERVICE_ACCOUNT, which cloudrun-setup.sh prints (see README "Deploy on Google Cloud Run").

name: Deploy

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

# One deploy at a time; a newer push waits for the running one instead of racing it
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # signs in to Google Cloud with Workload Identity Federation (no stored key)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ygo-calc/web:${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Scales to zero when idle and wakes on the next request. One instance at most: the rate
      # limits are counted in that process's memory. Card images are cached in the Cloud Storage
      # bucket mounted at /cache (owned by the image's app user, uid 10001). The EDOPro SQLite
      # databases stay in the container's own /tmp instead, as the bucket mount has no file locking.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ygo-calc \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "ygo-calc-run@$PROJECT_ID.iam.gserviceaccount.com" \
            --port 8000 \
            --cpu 1 --memory 1Gi \
            --min-instances 0 --max-instances 1 \
            --execution-environment gen2 \
            --add-volume "name=cache,type=cloud-storage,bucket=$PROJECT_ID-ygo-cache,mount-options=uid=10001;gid=10001" \
            --add-volume-mount "volume=cache,mount-path=/cache" \
            --set-env-vars "LOCALAPPDATA=/tmp" \
            --allow-unauthenticated
