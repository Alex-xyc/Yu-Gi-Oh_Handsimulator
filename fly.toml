# Fly.io deployment of the web app (see README "Deploy on Fly.io").
#   fly deploy        build the Dockerfile on Fly's builders and roll out
#   fly logs          follow the server log
# The GitHub "Deploy" workflow runs `fly deploy` after CI passes on main.

app = "ygo-calc"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # Sleeps when idle (no cost while stopped) and wakes on the next request in a few seconds
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Card images and EDOPro databases, kept across deploys. Keep a single machine: the volume
# attaches to one machine and the rate limits are counted in that process's memory.
[[mounts]]
  source = "ygo_cache"
  destination = "/cache"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
